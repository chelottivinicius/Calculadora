<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculadora — estilo iPhone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="calculator" role="region" aria-label="Calculadora"> 
      <div id="display" class="display" aria-live="polite">0</div>

      <div class="keys" role="group" aria-label="Teclado da calculadora">
        <button class="btn btn-fn" data-action="clear" aria-label="Limpar">AC</button>
        <button class="btn btn-fn" data-action="plusminus" aria-label="Trocar sinal">±</button>
        <button class="btn btn-fn" data-action="percent" aria-label="Percento">%</button>
        <button class="btn btn-op" data-action="divide" aria-label="Dividir">÷</button>

        <button class="btn" data-digit="7">7</button>
        <button class="btn" data-digit="8">8</button>
        <button class="btn" data-digit="9">9</button>
        <button class="btn btn-op" data-action="multiply" aria-label="Multiplicar">×</button>

        <button class="btn" data-digit="4">4</button>
        <button class="btn" data-digit="5">5</button>
        <button class="btn" data-digit="6">6</button>
        <button class="btn btn-op" data-action="subtract" aria-label="Subtrair">−</button>

        <button class="btn" data-digit="1">1</button>
        <button class="btn" data-digit="2">2</button>
        <button class="btn" data-digit="3">3</button>
        <button class="btn btn-op" data-action="add" aria-label="Somar">+</button>
        <button class="btn btn-keys" data-digit="()">( )</button>
        <button class="btn btn-zero" data-digit="0">0</button>
        <button class="btn" data-action="decimal" aria-label="Decimal">.</button>
        <button class="btn btn-equals" data-action="equals" aria-label="Igual">=</button>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
